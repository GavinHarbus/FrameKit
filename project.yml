name: FrameKit
options:
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  FrameKitCore:
    type: library.static
    platform: macOS
    sources: [Sources/FrameKitCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framekit.local.core
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  FrameKit:
    type: application
    platform: macOS
    sources: [Sources/FrameKit, Resources/Assets.xcassets]
    dependencies:
      - target: FrameKitCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSScreenCaptureUsageDescription: FrameKit 需要读取你选择的应用窗口，以预览、截取和导出图片。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framekit.local
        PRODUCT_NAME: FrameKit
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FrameKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FrameKitTests]
    dependencies:
      - target: FrameKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framekit.local.tests
schemes:
  FrameKit:
    build:
      targets:
        FrameKit: all
    test:
      targets: [FrameKitTests]
      gatherCoverageData: true

